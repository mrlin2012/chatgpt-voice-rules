name: One-time rewrite commit email metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-commit-email.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message == 'TEMP: rewrite commit email metadata'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite author and committer email metadata
        env:
          PRIVATE_EMAIL: "240658752+mrlin2012@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "mrlin2012"
          git config user.email "$PRIVATE_EMAIL"
          git filter-branch --force --env-filter '
            if [ "$GIT_AUTHOR_NAME" = "mrlin2012" ]; then
              export GIT_AUTHOR_EMAIL="'"$PRIVATE_EMAIL"'"
            fi
            if [ "$GIT_COMMITTER_NAME" = "mrlin2012" ]; then
              export GIT_COMMITTER_EMAIL="'"$PRIVATE_EMAIL"'"
            fi
          ' -- main
          git log --format='%h %an <%ae> | %cn <%ce>' main
          git push --force origin main
